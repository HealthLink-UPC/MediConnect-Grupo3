spring.application.name=MediConnect_Project

# ==========================================
# CONEXION A POSTGRESQL (Session pooler, IPv4 compatible con Render)
# ==========================================

spring.datasource.url=jdbc:postgresql://aws-0-sa-east-1.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.username=postgres.phmmyntqgxwqefrrckqt
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# JPA / HIBERNATE
# ==========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=mediconnect

# Dialecto PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ==========================================
# LOGS
# ==========================================

logging.level.root=INFO

# ==========================================
# JWT
# ==========================================

jwt.secret=${JWT_SECRET}

# ==========================================
# VERIFICACION EN DOS PASOS (codigo por correo)
# ==========================================

app.mfa.activo=true
app.mfa.minutos=5
app.mfa.max-intentos=5

# Correo que envia el codigo. Las credenciales NO se escriben aqui: se leen de variables de entorno
# MAIL_USUARIO (p. ej. micuenta@gmail.com) y MAIL_CLAVE (contrasena de aplicacion de Google).
# Si MAIL_USUARIO esta vacia, el backend funciona en MODO PRUEBA y escribe el codigo en el log en vez de enviarlo.
# Brevo (API web por HTTPS). Es lo que hay que usar en Render gratis, que bloquea el SMTP de Gmail.
# BREVO_API_KEY: clave de API de Brevo. MAIL_REMITENTE: correo remitente verificado en Brevo.
# Si ambas estan definidas se usa Brevo; si no, SMTP (Gmail); si tampoco, MODO PRUEBA.
app.mail.brevo-api-key=${BREVO_API_KEY:}
app.mail.remitente=${MAIL_REMITENTE:}
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USUARIO:}
spring.mail.password=${MAIL_CLAVE:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=8000
spring.mail.properties.mail.smtp.timeout=8000
spring.mail.properties.mail.smtp.writetimeout=8000

# ==========================================
# CORS (frontend Angular). Varios origenes separados por coma.
# En Render: variable de entorno APP_CORS_ORIGENES con la URL de Vercel.
# ==========================================

app.cors.origenes=${APP_CORS_ORIGENES:http://localhost:4200,http://127.0.0.1:4200}

# ==========================================
# THYMELEAF
# ==========================================

spring.thymeleaf.cache=false

# ==========================================
# SERVIDOR
# ==========================================

server.port=${PORT:8080}
